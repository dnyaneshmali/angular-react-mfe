<header class="main-header">
  <div class="container">
    <div class="logo">
      <span class="bank-icon">🏦</span>
      <span class="bank-name">Antigravity <span>Bank</span></span>
    </div>

    <nav class="nav-links">
      @if (currentUser) {
        <a routerLink="/dashboard">Dashboard</a>
        <a href="#">Personal</a>
        <a href="#">Business</a>
        <a href="#">Invest</a>
        <a href="#">Support</a>
      }
    </nav>

    <div class="actions">
      @if (currentUser) {
        <!-- Logged in state -->
        <div class="user-info">
          <div class="user-avatar" [attr.title]="currentUser.name">
            {{ currentUser.name.charAt(0).toUpperCase() }}
          </div>
          <div class="user-details">
            <span class="user-name">{{ currentUser.name }}</span>
            <span class="user-role">{{ getRoleLabel(currentUser.role) }}</span>
          </div>
          <button class="btn-logout" (click)="onLogout()" id="logout-btn" title="Logout">
            <span>Logout</span>
            <span class="logout-icon">↪</span>
          </button>
        </div>
      } @else {
        <!-- Logged out state -->
        <button class="btn-login" id="login-nav-btn" (click)="onLogin()">Secure Login</button>
      }
    </div>
  </div>
</header>
