<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Securely log in to your account</p>
    </div>
    <form class="login-form">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" placeholder="Enter your credentials">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>
      <button type="button" class="btn-submit">Login Securely</button>
    </form>
    <div class="login-footer">
      <p>Don't have an account? <a href="#">Open one today</a></p>
    </div>
  </div>
</div>
